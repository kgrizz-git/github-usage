# Example email-report options for github-usage.
# Copy to .github-usage/config.toml or run: scripts/setup
#
# This file contains no secrets. Generated local config lives in .github-usage/ (gitignored).

[cache]
# Reuse recent billing API snapshots for legacy and email reports (seconds).
# Set to 0 to disable caching. Default when omitted: 3600 (1 hour).
max_age_seconds = 3600

[email_report]
include_consumers = false
include_artifact_storage = false
include_release_assets = false
include_forecast = true
# Optional: set a monthly premium-requests limit to show a run-out day.
# When omitted, premium requests are projected but no run-out day is shown.
# premium_requests_limit = 10000
max_repos = 100
# Email body format: "text" (default) or "html".
# HTML delivers styled tables to clients that support it; text is the fallback.
#
# IMPORTANT — how this setting reaches GitHub Actions:
#   .github-usage/config.toml is gitignored (it holds secrets alongside settings).
#   After changing email_format here, re-run setup option 5 "GitHub Actions workflow"
#   (or the TUI wizard) to re-render .github/workflows/email-report.yml, then
#   commit that file. The workflow YAML is the committed source of truth for CI.
email_format = "text"
warn_over = [
  "25",
  "80%",
]
skip_actions = false
skip_copilot = false
skip_lfs = false
only_public = false
only_private = false

[schedule]
weekday = 1
hour = 9
minute = 0

[github_actions]
cron = "0 9 * * 1"
include_consumers = false
include_artifact_storage = false
include_release_assets = false
