name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  local-security:
    name: Local security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python security tools
        # Editable install of this repo's own package; transitive versions are
        # constrained by pyproject/uv.lock, not resolved freely at CI time.
        run: python -m pip install -e '.[dev]'  # NOSONAR(githubactions:S8544)
      - name: Install Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run repository security script
        run: GITHUB_USAGE_SKIP_GITLEAKS=1 scripts/security
